<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="index.html"><button>sair da conta</button></a>
    <h1>Tela Inicial do Administrador</h1>

    <h2>cadastrar funcionario</h2>
    <input id="nome_cad_funcionario" placeholder="nome do funcionario">
    <input id="email_cad_funcionario" placeholder="email do funcionario">
    <input id="senha_cad_funcionario" placeholder="senha para o funcionario">
    <button id="btn_cadastrar_funcionario">cadastrar novo funcionario</button>
    <h2>Atualizar funcionario</h2>
    <input id="id_campo_funcionario_atualizar" placeholder="digite o id do funcionario">
    <input id="nome_att_funcionario" placeholder="nome do funcionario">
    <input id="email_att_funcionario" placeholder="email do funcionario">
    <input id="senha_att_funcionario" placeholder="senha para o funcionario">
    <button id="btn_atualizar_funcionario">Atualizar funcionario</button>
    <h2>Excluir funcionario</h2>
    <input id="id_campo_funcionario_deletar" placeholder="digite o id do funcionario">
    <button id="btn_deletar_funcionario">deletar funcionario</button>
    <br><br>
    <h2>ver lista de funcionarios</h2>
    <button id="btn_listar_funcionarios">Ver Lista de Funcionarios</button>


    <br><br>
    <h2>Ver lista de produtos</h2>
    <button id="btn_listar_produtos">Ver lista de produtos</button>
    <div id="lista_produtos"></div>
</body>
</html>
